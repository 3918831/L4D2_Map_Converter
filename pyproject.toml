[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "l4d2-map-converter"
version = "0.6.0"
description = "Audited L4D2 BSP visual conversion with native lighting and optional automatic reflection capture"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
l4d2-map-converter = "l4d2_bsp.workflow:main"

[tool.setuptools]
packages = ["l4d2_bsp"]
include-package-data = false

[tool.setuptools.package-data]
l4d2_bsp = ["preset_data/c5m1-daylight-v1.json", "preset_data/c4m3-overcast-static-v1.json", "preset_data/c7m1-hazy-static-v1.json"]
